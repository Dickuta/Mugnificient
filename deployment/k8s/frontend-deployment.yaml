apiVersion: apps/v1
kind: Deployment
metadata:
  name: mugstore-frontend
  labels:
    app: mugstore
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mugstore
      component: frontend
  template:
    metadata:
      labels:
        app: mugstore
        component: frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/mugstore-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mugstore-frontend
spec:
  selector:
    app: mugstore
    component: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

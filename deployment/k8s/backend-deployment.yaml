apiVersion: apps/v1
kind: Deployment
metadata:
  name: mugstore-backend
  labels:
    app: mugstore
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mugstore
      component: backend
  template:
    metadata:
      labels:
        app: mugstore
        component: backend
    spec:
      containers:
      - name: backend
        image: your-registry/mugstore-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: USE_SQLITE
          value: "false"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: mugstore-config
              key: postgres_host
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mugstore-secrets
              key: postgres_password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mugstore-secrets
              key: secret_key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mugstore-backend
spec:
  selector:
    app: mugstore
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

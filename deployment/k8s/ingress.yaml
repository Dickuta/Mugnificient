apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mugstore-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - mugstore.yourdomain.com
    secretName: mugstore-tls
  rules:
  - host: mugstore.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mugstore-backend
            port:
              number: 8000
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: mugstore-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mugstore-frontend
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mugstore-config
data:
  postgres_host: "mugstore-postgres"
  allowed_origins: "https://mugstore.yourdomain.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: mugstore-secrets
type: Opaque
stringData:
  postgres_password: "change_me_in_production"
  secret_key: "change_me_in_production"

# Docker Compose for Production-like Testing
# This setup mirrors production but uses SQLite for easier local testing

services:
  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.test
      args:
        - VITE_APP_NAME=Mugnificent
        - VITE_APP_PRIMARY_COLOR=#003366
        - VITE_APP_SECONDARY_COLOR=#D4AF37
    container_name: mugstore-app
    ports:
      - "80:80"
      - "8000:8000"
    environment:
      - USE_SQLITE=true
      - SECRET_KEY=test-secret-key-change-in-production-12345
      - ALLOWED_ORIGINS=http://localhost:80,http://localhost:8000,http://127.0.0.1:80,http://127.0.0.1:8000
      - DEBUG=true
      - ADMIN_EMAIL=admin@mugstore.test
    volumes:
      - app_data:/app
    networks:
      - mugstore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: mugstore-db
    environment:
      - POSTGRES_DB=mugstore
      - POSTGRES_USER=mugstore
      - POSTGRES_PASSWORD=mugstore123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mugstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mugstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mugstore-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - mugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: mugstore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - mugstore-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: mugstore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mugstore-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mugstore-network:
    driver: bridge

volumes:
  app_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
